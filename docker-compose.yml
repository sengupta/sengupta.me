services:
  jekyll:
    image: jekyll/jekyll:latest
    platform: linux/amd64
    ports:
      - "4000:4000"
      - "35729:35729"
    volumes:
      - .:/srv/jekyll
      - bundle_cache:/usr/local/bundle
    working_dir: /srv/jekyll
    command: bash -lc "bundle install && bundle exec jekyll serve --livereload --host 0.0.0.0 --port 4000"
volumes:
  bundle_cache:
